<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選擇｜大點自由彈跳版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:15px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
footer{position:fixed;inset:auto 0 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;padding:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#151518a6}
label{display:flex;align-items:center;gap:8px;flex:1 1 185px;max-width:435px}
input{flex:1;min-width:0;accent-color:#fff}
output{min-width:5ch;text-align:right;font-variant-numeric:tabular-nums}
button{background:#27282e;color:#fff;border:1px solid #666871;border-radius:6px;padding:8px 10px;font:inherit}
small{color:#ddd;text-align:center}
button:focus-visible,canvas:focus-visible{outline:2px solid white;outline-offset:-2px}
</style>
<main>
  <canvas id="stage" tabindex="0" aria-label="選擇，大點自由彈跳互動。拖曳或按左右方向鍵改變角度"></canvas>
</main>
<footer>
  <label>角度 <input id="angle" type="range" min="0" max="360" step="0.1" value="0"><output id="readout">0°</output></label>
  <button id="play" type="button">播放預覽</button>
  <button id="motion" type="button" aria-pressed="false">啟用陀螺儀</button>
  <button id="zero" type="button">校正 0°</button>
  <small id="status" role="status">拖曳畫面、使用滑桿，或播放預覽</small>
</footer>
<script>
'use strict';
const stage = document.querySelector('#stage');
const ctx = stage.getContext('2d');
const slider = document.querySelector('#angle');
const readout = document.querySelector('#readout');
const play = document.querySelector('#play');
const motion = document.querySelector('#motion');
const status = document.querySelector('#status');
const sentences = [['我們都', '決定好了'], ['你就該', '完成', '我的夢想']];
const dotCount = 1050;
const mergeTime = .18;
const maxGroupSize = 14;
const minMovingBodies = 78;
const releaseEnd = 7.4;
const returnSpan = 20;
const step = 1 / 120;
const bouncePace = .84;
const tau = 2 * Math.PI;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const range = (value, min, max) => clamp((value - min) / (max - min), 0, 1);
const smooth = value => value * value * (3 - 2 * value);
const wrap = value => ((value % 360) + 360) % 360;
const lerp = (a, b, progress) => a + (b - a) * progress;

function random(seed) {
  return () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
}

let width, height, viewWidth, viewHeight, scale, glyphs, balls = [], groups = [];
let angle = 0, appliedAngle = 0, direction = 1, settledAt = 0;
let preview = null, drag = null, physicsTime = 0;
let usingMotion = false, calibrationScreen = screenRotation();
let lastRaw = null, unwrapped = 0, zero = 0, filtered = null;
let lastSensorTime = 0, lastEvent = 0;

function screenRotation() {
  return window.screen?.orientation?.angle ?? window.orientation ?? 0;
}

function viewRotation() {
  if (!usingMotion) return 0;
  return Math.round((screenRotation() - calibrationScreen) / 90) * 90;
}

function gravityDirection(degrees) {
  const radians = wrap(degrees) * Math.PI / 180;
  const x = Math.sin(radians), y = Math.cos(radians);
  return {x: Math.abs(x) < 1e-9 ? 0 : x, y: Math.abs(y) < 1e-9 ? 0 : y};
}

function gravityStrength() {
  // Scaling acceleration by pace squared slows the wall launch by pace at the same height.
  return Math.min(width, height) * .91 * bouncePace ** 2;
}

function glyphPoints(index) {
  const lines = sentences[index];
  const tracking = 1.10, leading = 1.16;
  const columns = Math.max(...lines.map(line => line.length));
  const size = Math.min(width * .94 / (columns * tracking), height * .78 / (lines.length * leading), 185);
  const mask = document.createElement('canvas');
  mask.width = Math.ceil(width);
  mask.height = Math.ceil(height);
  const ink = mask.getContext('2d', {willReadFrequently: true});
  ink.translate(width / 2, height / 2);
  if (index === 1) ink.rotate(Math.PI);
  ink.font = '400 ' + size + 'px "DFKai-SB", "STKaiti", "Kaiti TC", KaiTi, "Microsoft JhengHei", serif';
  ink.textAlign = 'center';
  ink.textBaseline = 'alphabetic';
  ink.lineJoin = 'round';
  ink.lineWidth = Math.max(.55, size * .016);
  for (const [row, line] of lines.entries()) {
    const metrics = ink.measureText(line);
    const baseline = (row - (lines.length - 1) / 2) * size * leading +
      (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
    for (const [column, character] of Array.from(line).entries()) {
      const x = (column - (line.length - 1) / 2) * size * tracking;
      ink.strokeText(character, x, baseline);
      ink.fillText(character, x, baseline);
    }
  }

  const pixels = ink.getImageData(0, 0, mask.width, mask.height).data;
  const rng = random(8179 + index * 1049);
  const candidates = [];
  const stride = Math.max(1, Math.round(size / 59));
  for (let y = 1; y < height - 1; y += stride) {
    for (let x = 1 + Math.floor(y / stride) % stride; x < width - 1; x += stride) {
      const alpha = pixels[(y * mask.width + x) * 4 + 3];
      if (alpha >= 102) candidates.push({x: x + .5, y: y + .5, weight: .75 + .25 * alpha / 255, distance: Infinity});
    }
  }
  const points = [];
  let chosen = candidates[Math.floor(rng() * candidates.length)];
  while (chosen && points.length < dotCount) {
    points.push({x: chosen.x, y: chosen.y});
    let next = null, score = 0;
    for (const point of candidates) {
      const dx = chosen.x - point.x, dy = chosen.y - point.y;
      point.distance = Math.min(point.distance, dx * dx + dy * dy);
      const value = point.distance * point.weight;
      if (value > score) { score = value; next = point; }
    }
    chosen = next;
  }
  return {points, size};
}

function buildGlyphs() {
  const first = glyphPoints(0), second = glyphPoints(1);
  const available = Math.min(first.points.length, second.points.length);
  const count = balls.length || available;
  for (const glyph of [first, second]) {
    if (!glyph.points.length) glyph.points.push({x: width / 2, y: height / 2});
    const points = glyph.points.slice();
    glyph.points = Array.from({length: count}, (_, i) => points[i % points.length]);
    // Matching by reading order keeps the last flight local on both orientations.
    glyph.points.sort((a, b) => a.y - b.y || a.x - b.x);
  }
  return [first, second];
}

function makeBalls() {
  const rng = random(80291);
  const count = glyphs[0].points.length;
  const order = Array.from({length: count}, (_, id) => id);
  for (let i = count - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const rank = new Array(count);
  order.forEach((id, i) => { rank[id] = (i + 1) / count; });
  const unit = clamp(Math.min(...glyphs.map(glyph => glyph.size)) * .0155, 1.14, 2.55);
  const spacing = glyphs.map(glyph => glyph.points.map((point, id) => {
    let nearest = Infinity;
    for (const [otherId, other] of glyph.points.entries()) {
      if (id !== otherId) nearest = Math.min(nearest, (point.x - other.x) ** 2 + (point.y - other.y) ** 2);
    }
    return Math.sqrt(nearest);
  }));
  return glyphs[0].points.map((point, id) => {
    const pick = rng(), power = rng();
    const band = pick < .30 ? 'low' : pick < .73 ? 'medium' : 'high';
    const rebound = band === 'low' ? lerp(.14, .33, power)
      : band === 'medium' ? lerp(.38, .77, power) : lerp(1.04, 1.51, power);
    const preferred = unit * lerp(.83, 1.44, rng());
    const room = Math.min(spacing[0][id], spacing[1][id]) * .49;
    const r = Math.min(preferred, Math.max(room, unit * .8));
    return {
      id, x: point.x, y: point.y, vx: 0, vy: 0, r,
      band, rebound, spring: lerp(.75, .88, rng()), drift: lerp(-.2, .2, rng()),
      bounceNoise: random(50789 + id * 7919),
      release: .13 + (releaseEnd - .13) * rank[id] ** .72,
      arrive: lerp(.32, 1, rank[id] ** .88),
      begin: lerp(.015, .68, rng()),
      hop: rng() < .34 ? lerp(.7, 1.65, rng()) : 0,
      state: 'fixed', anchor: 0, route: null, impacts: 0, nextContact: 0, emission: null
    };
  });
}

function keepInside(ball) {
  ball.x = clamp(ball.x, ball.r, width - ball.r);
  ball.y = clamp(ball.y, ball.r, height - ball.r);
}

function resize() {
  const previousWidth = width, previousHeight = height;
  viewWidth = stage.clientWidth;
  viewHeight = stage.clientHeight;
  if (viewWidth < 12 || viewHeight < 12) return;
  const sideways = viewRotation() % 180 !== 0;
  width = sideways ? viewHeight : viewWidth;
  height = sideways ? viewWidth : viewHeight;
  scale = Math.min(window.devicePixelRatio || 1, 2);
  stage.width = Math.round(viewWidth * scale);
  stage.height = Math.round(viewHeight * scale);
  if (width === previousWidth && height === previousHeight) return;
  glyphs = buildGlyphs();
  if (!balls.length) {
    balls = makeBalls();
    return;
  }
  for (const group of groups) {
    group.x *= width / previousWidth;
    group.y *= height / previousHeight;
    group.vx *= width / previousWidth;
    group.vy *= height / previousHeight;
    group.route = null;
    group.swallow = null;
    keepInside(group);
  }
  for (const ball of balls) {
    if (ball.state === 'absorbed') continue;
    if (ball.state === 'fixed') {
      const point = glyphs[ball.anchor].points[ball.id];
      ball.x = point.x;
      ball.y = point.y;
    } else {
      ball.x *= width / previousWidth;
      ball.y *= height / previousHeight;
      ball.vx *= width / previousWidth;
      ball.vy *= height / previousHeight;
      if (ball.state === 'returning') ball.route = null;
    }
    keepInside(ball);
  }
}

function fall(ball) {
  ball.state = 'free';
  ball.route = null;
  ball.impacts = 0;
}

function wallImpact(ball, axis, sign, acceleration, force) {
  const velocity = axis === 'x' ? 'vx' : 'vy';
  const tangent = axis === 'x' ? 'vy' : 'vx';
  const extent = axis === 'x' ? width : height;
  const incoming = Math.abs(ball[velocity]);
  const floor = sign * acceleration > 0 && force > 0
    ? smooth(range(Math.abs(acceleration) / force, .30, .70)) : 0;
  ball.impacts++;
  const vary = ball.bounceNoise();
  const restitution = clamp(.875 + (ball.spring - .75) * .75 + (vary - .5) * .065, .855, .981);
  let rebound = incoming * restitution;
  if (floor) {
    const energy = 2 * Math.abs(acceleration) * (extent - 2 * ball.r);
    const peak = Math.min(1.62, ball.rebound * lerp(.82, 1.22, vary));
    const replenished = Math.sqrt(energy * peak);
    rebound += floor * Math.max(0, replenished - rebound);
    const sidewaysKick = ball.drift * .24 + (ball.bounceNoise() - .5) * .36;
    ball[tangent] += floor * rebound * sidewaysKick;
  }
  ball[velocity] = -sign * rebound;
}

function timeToWall(position, speed, acceleration, wall, side, duration) {
  const distance = wall - position;
  if (side * (position + (speed + acceleration * duration / 2) * duration - wall) < 0) {
    if (Math.abs(acceleration) < 1e-9) return Infinity;
    const turn = -speed / acceleration;
    if (turn <= 0 || turn >= duration ||
        side * (position + (speed + acceleration * turn / 2) * turn - wall) < 0) return Infinity;
  }
  if (Math.abs(acceleration) < 1e-9) {
    if (side * speed <= 0) return Infinity;
    const time = distance / speed;
    return time >= -1e-9 && time <= duration + 1e-9 ? clamp(time, 0, duration) : Infinity;
  }
  const squared = speed * speed + 2 * acceleration * distance;
  if (squared < 0 || (squared === 0 && side * acceleration <= 0)) return Infinity;
  const impactSpeed = side * Math.sqrt(squared);
  const sum = speed + impactSpeed;
  const time = Math.abs(sum) > 1e-8 ? 2 * distance / sum : (impactSpeed - speed) / acceleration;
  return time >= -1e-9 && time <= duration + 1e-9 ? clamp(time, 0, duration) : Infinity;
}

function advanceBall(ball, gx, gy, force, dt) {
  // Advance to actual contact first, then use the remaining time for the rebound.
  for (let remaining = dt, contacts = 0; remaining > 1e-8 && contacts < 5; contacts++) {
    const left = timeToWall(ball.x, ball.vx, gx, ball.r, -1, remaining);
    const right = timeToWall(ball.x, ball.vx, gx, width - ball.r, 1, remaining);
    const top = timeToWall(ball.y, ball.vy, gy, ball.r, -1, remaining);
    const bottom = timeToWall(ball.y, ball.vy, gy, height - ball.r, 1, remaining);
    const hit = Math.min(left, right, top, bottom);
    const travel = Math.min(hit, remaining);
    ball.x += (ball.vx + gx * travel / 2) * travel;
    ball.y += (ball.vy + gy * travel / 2) * travel;
    ball.vx += gx * travel;
    ball.vy += gy * travel;
    remaining -= travel;
    if (hit === Infinity) break;
    if (Math.abs(Math.min(left, right) - hit) < 1e-8) {
      const sign = left <= right ? -1 : 1;
      ball.x = sign < 0 ? ball.r : width - ball.r;
      wallImpact(ball, 'x', sign, gx, force);
    }
    if (Math.abs(Math.min(top, bottom) - hit) < 1e-8) {
      const sign = top <= bottom ? -1 : 1;
      ball.y = sign < 0 ? ball.r : height - ball.r;
      wallImpact(ball, 'y', sign, gy, force);
    }
    // Treat a zero-speed contact under tiny tangential gravity as a resting axis.
    if (travel < 1e-8) {
      if (Math.abs(ball.vx) < 1e-8 && ((ball.x === ball.r && gx < 0) ||
          (ball.x === width - ball.r && gx > 0))) gx = 0;
      if (Math.abs(ball.vy) < 1e-8 && ((ball.y === ball.r && gy < 0) ||
          (ball.y === height - ball.r && gy > 0))) gy = 0;
    }
  }
  keepInside(ball);
}

function collidePair(a, b, down) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const extent = a.r + b.r;
  const distanceSquared = dx * dx + dy * dy;
  if (distanceSquared >= extent * extent || distanceSquared < 1e-9) return;
  const distance = Math.sqrt(distanceSquared);
  const nx = dx / distance, ny = dy / distance;
  // Glancing contacts add variety without turning the dense floor layer into a pile.
  if (Math.abs(nx * down.x + ny * down.y) > .48) return;
  const aWeight = b.r ** 2 / (a.r ** 2 + b.r ** 2);
  const bWeight = 1 - aWeight;
  const separation = (extent - distance) * .44;
  a.x -= nx * separation * aWeight;
  a.y -= ny * separation * aWeight;
  b.x += nx * separation * bWeight;
  b.y += ny * separation * bWeight;
  keepInside(a);
  keepInside(b);
  const approaching = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (approaching <= 0) return;
  const impulse = 1.89 * approaching;
  a.nextContact = b.nextContact = physicsTime + .21;
  a.vx -= impulse * nx * aWeight;
  a.vy -= impulse * ny * aWeight;
  b.vx += impulse * nx * bWeight;
  b.vy += impulse * ny * bWeight;
}

﻿function mergeBodies(first, second) {
  const a = first.r >= second.r ? first : second;
  const b = a === first ? second : first;
  const aMass = a.mass ?? a.r ** 2, bMass = b.mass ?? b.r ** 2;
  const mass = aMass + bMass, weight = bMass / mass;
  const members = [...(a.members || [a]), ...(b.members || [b])];
  const group = {
    id: a.id, x: a.x, y: a.y, r: Math.sqrt(mass), mass, members, emissions: [],
    vx: lerp(a.vx, b.vx, weight), vy: lerp(a.vy, b.vy, weight),
    rebound: a.rebound, drift: lerp(a.drift, b.drift, weight), spring: lerp(a.spring, b.spring, weight),
    bounceNoise: a.bounceNoise, impacts: Math.max(a.impacts, b.impacts),
    begin: (Math.imul(a.id + 13, 2654435761) >>> 0) / 4294967296 * .7 + .018,
    hop: .45, state: 'free', route: null, nextContact: physicsTime + mergeTime,
    swallow: {mass: aMass, incoming: bMass, x: b.x - a.x, y: b.y - a.y, until: physicsTime + mergeTime}
  };
  for (const body of [a, b]) {
    body.state = 'absorbed';
    if (body.members) body.dead = true;
  }
  keepInside(group);
  groups.push(group);
}

function contactBodies(a, b, down, allowMerge) {
  const dx = b.x - a.x, dy = b.y - a.y, radius = a.r + b.r;
  const distanceSquared = dx * dx + dy * dy;
  if (distanceSquared > radius * radius) return false;
  const size = (a.members?.length || 1) + (b.members?.length || 1);
  const closing = (a.vx - b.vx) * dx + (a.vy - b.vy) * dy;
  // Only circles in real contact can merge. Area and original dots are both retained.
  if (allowMerge && size <= maxGroupSize && (closing > 0 || distanceSquared < radius ** 2 * .76)) {
    mergeBodies(a, b);
    return true;
  }
  if (a.impacts && b.impacts) collidePair(a, b, down);
  return false;
}

function collideMovingBodies(down, allowMerge) {
  const bodies = [...groups, ...balls].filter(body => body.state === 'free');
  let active = bodies.length;
  const cell = Math.max(18, Math.max(...bodies.map(body => body.r), 1) * 2);
  const columns = Math.ceil(width / cell) + 2;
  const buckets = new Map();
  for (const body of bodies) {
    if (body.nextContact > physicsTime || body.emission || body.emissions?.length) continue;
    const row = Math.floor(body.y / cell) + 1, column = Math.floor(body.x / cell) + 1;
    for (let dy = -1; dy <= 1 && body.state === 'free'; dy++) {
      for (let dx = -1; dx <= 1 && body.state === 'free'; dx++) {
        const adjacent = buckets.get((row + dy) * columns + column + dx);
        if (!adjacent) continue;
        for (const other of adjacent) {
          if (body.nextContact > physicsTime || other.state !== 'free' || other.nextContact > physicsTime) continue;
          if (contactBodies(body, other, down, allowMerge && active > minMovingBodies)) {
            active--;
            break;
          }
        }
      }
    }
    if (body.state !== 'free') continue;
    const key = row * columns + column;
    if (buckets.has(key)) buckets.get(key).push(body);
    else buckets.set(key, [body]);
  }
  groups = groups.filter(group => !group.dead);
}

function textIndex(checkpoint) {
  return wrap(checkpoint) === 180 ? 1 : 0;
}

function endAt(ball, index) {
  const point = glyphs[index].points[ball.id];
  ball.x = point.x;
  ball.y = point.y;
  ball.vx = ball.vy = 0;
  ball.anchor = index;
  ball.state = 'fixed';
  ball.route = null;
  ball.emission = null;
}

function makeRoute(ball, index, progress, down, targetId = ball.id) {
  const point = glyphs[index].points[targetId];
  const distance = Math.hypot(point.x - ball.x, point.y - ball.y);
  const span = Math.min(width, height);
  const expectedSeconds = clamp(distance / (span * .64), .16, .62);
  const tangentLimit = Math.max(ball.r, distance * .48);
  const speed = Math.hypot(ball.vx, ball.vy);
  const handleTime = speed ? Math.min(expectedSeconds / 3, tangentLimit / speed) : 0;
  const lift = Math.min(span * .17, distance * .19);
  return {
    index, targetId, start: progress, x: ball.x, y: ball.y,
    hx: clamp(ball.x + ball.vx * handleTime, ball.r, width - ball.r),
    hy: clamp(ball.y + ball.vy * handleTime, ball.r, height - ball.r),
    ax: clamp(point.x - down.x * lift, ball.r, width - ball.r),
    ay: clamp(point.y - down.y * lift, ball.r, height - ball.r),
    down, end: Math.max(ball.arrive, progress + .04)
  };
}

function followRoute(ball, progress, dt) {
  const route = ball.route, point = glyphs[route.index].points[route.targetId];
  const t = range(progress, route.start, Math.min(1, route.end));
  if (t >= 1 && !ball.members) {
    endAt(ball, route.index);
    return;
  }
  const landing = ball.hop ? .83 : 1;
  let x, y;
  if (t < landing) {
    const u = t / landing;
    // Preserve the tangent at departure, then bring the derivative to zero at contact.
    const eased = u + u * u - u * u * u;
    const v = 1 - eased;
    x = v ** 3 * route.x + 3 * v * v * eased * route.hx +
      3 * v * eased * eased * route.ax + eased ** 3 * point.x;
    y = v ** 3 * route.y + 3 * v * v * eased * route.hy +
      3 * v * eased * eased * route.ay + eased ** 3 * point.y;
  } else {
    const hop = ball.hop ? ball.hop * ball.r * Math.sin(Math.PI * range(t, landing, 1)) ** 2 : 0;
    x = point.x - route.down.x * hop;
    y = point.y - route.down.y * hop;
  }
  const speedCap = Math.min(width, height) * 2.3;
  ball.vx = clamp((x - ball.x) / Math.max(dt, 1 / 240), -speedCap, speedCap);
  ball.vy = clamp((y - ball.y) / Math.max(dt, 1 / 240), -speedCap, speedCap);
  ball.x = x;
  ball.y = y;
  keepInside(ball);
}

﻿function setAngle(degrees) {
  if (Number.isFinite(degrees)) angle = degrees;
}

function emissionProgress(emission) {
  return smooth(clamp(Math.max((physicsTime - emission.time) / .34,
    emission.direction * (angle - emission.angle) / .68), 0, 1));
}

function emitMember(group, index, progress, down) {
  const ball = group.members.pop();
  const point = glyphs[index].points[ball.id];
  const dx = point.x - group.x, dy = point.y - group.y;
  const length = Math.hypot(dx, dy) || 1;
  const surface = group.members.length ? Math.max(0, group.r - ball.r * .25) : 0;
  ball.x = group.x + dx / length * surface;
  ball.y = group.y + dy / length * surface;
  const kick = Math.sqrt(Math.min(width, height)) * .65;
  ball.vx = group.vx + dx / length * kick;
  ball.vy = group.vy + dy / length * kick;
  keepInside(ball);
  group.mass = Math.max(0, group.mass - ball.r ** 2);
  group.r = Math.sqrt(group.mass);
  ball.emission = {time: physicsTime, angle, direction};
  group.emissions.push(ball);
  ball.state = 'returning';
  ball.route = makeRoute(ball, index, Math.min(progress, .97), down);
  const deadline = .977 + (ball.id % 19) * .00119;
  ball.route.end = Math.min(deadline, progress + .075 + .093 * Math.min(1, length / (Math.min(width, height) * .55)));
}

function advanceGroup(group, progress, index, down, gx, gy, force, dt) {
  group.emissions = group.emissions.filter(ball => ball.emission && emissionProgress(ball.emission) < 1);
  if (!group.members.length) {
    if (!group.emissions.length) group.dead = true;
    return;
  }
  if (progress === null || group.route?.index !== index) {
    group.route = null;
    group.state = 'free';
  }
  if (!group.route) {
    const previous = group.impacts;
    advanceBall(group, gx, gy, force, dt);
    const rank = group.id / Math.max(1, balls.length - 1);
    const readingOrder = index === 1 ? 1 - rank : rank;
    const begin = group.begin * .7 + readingOrder * .195;
    if (progress === null || progress < begin ||
        (group.impacts === previous && progress < begin + .075) ||
        (group.swallow && physicsTime < group.swallow.until && progress < .87)) return;
    const points = glyphs[index].points;
    const distance = ball => Math.hypot(points[ball.id].x - group.x, points[ball.id].y - group.y);
    group.members.sort((a, b) => distance(b) - distance(a));
    group.route = makeRoute(group, index, Math.min(progress, .95), down, group.members.at(-1).id);
    group.route.end = Math.min(.945, progress + .14);
    group.splitStart = Math.min(.869, progress + (group.route.end - progress) * .81);
    group.splitEnd = Math.max(group.splitStart + .016, Math.min(.915, group.splitStart + .115));
    group.beforeSplit = group.members.length;
    group.state = 'returning';
    group.swallow = null;
  }
  followRoute(group, progress, dt);
  if (progress < group.splitStart) return;
  const fraction = range(progress, group.splitStart, group.splitEnd);
  const remaining = group.beforeSplit - 1 - Math.floor(fraction * (group.beforeSplit - 1) + 1e-7);
  while (group.members.length > remaining) emitMember(group, index, progress, down);
}

function settleCheckpoint(checkpoint, dt) {
  const index = textIndex(checkpoint), down = gravityDirection(checkpoint);
  for (const group of groups) for (const ball of group.members) {
    ball.x = group.x;
    ball.y = group.y;
    ball.vx = group.vx;
    ball.vy = group.vy;
  }
  for (const ball of balls) {
    if (ball.state === 'fixed' && ball.anchor === index) continue;
    if (ball.route?.index !== index) ball.route = makeRoute(ball, index, 0, down);
    followRoute(ball, 1, dt);
  }
  groups = [];
}

function update(dt) {
  if (!balls.length) return;
  physicsTime += dt;
  const delta = angle - appliedAngle;
  const moving = Math.sign(delta);
  if (moving) direction = moving;
  const crossed = moving > 0 ? (Math.floor(appliedAngle / 180) + 1) * 180
    : (Math.ceil(appliedAngle / 180) - 1) * 180;
  const checkpoint = Math.round(angle / 180) * 180;
  const isAtText = Math.abs(angle - checkpoint) <= (usingMotion ? .12 : 1e-7);
  const passedText = moving && moving * (angle - crossed) >= -1e-7;
  if ((isAtText || passedText) && (moving || settledAt === null)) {
    settledAt = isAtText ? checkpoint : crossed;
    settleCheckpoint(settledAt, dt);
  }
  appliedAngle = angle;
  if (isAtText) return;
  settledAt = null;

  const goal = direction > 0 ? Math.ceil(angle / 180) * 180 : Math.floor(angle / 180) * 180;
  const distance = Math.abs(goal - angle);
  const towardText = distance <= returnSpan;
  const glyph = textIndex(goal);
  const progress = towardText ? 1 - distance / returnSpan : 0;
  const down = gravityDirection(angle);
  const force = gravityStrength();
  const gx = down.x * force, gy = down.y * force;

  for (const group of groups) advanceGroup(group, towardText ? progress : null, glyph, down, gx, gy, force, dt);
  groups = groups.filter(group => !group.dead);
  for (const ball of balls) {
    if (ball.emission && emissionProgress(ball.emission) >= 1) ball.emission = null;
    if (ball.state === 'absorbed') continue;
    if (ball.state === 'fixed') {
      const away = Math.min(wrap(angle - ball.anchor * 180), wrap(ball.anchor * 180 - angle));
      if ((towardText && ball.anchor === glyph) || away < ball.release) continue;
      fall(ball);
    }
    if (ball.state === 'returning' && (!towardText || ball.route?.index !== glyph)) fall(ball);
    if (ball.state === 'returning' && ball.route) {
      followRoute(ball, progress, dt);
      continue;
    }
    const previous = ball.impacts;
    advanceBall(ball, gx, gy, force, dt);
    if (towardText && progress >= ball.begin &&
        (ball.impacts !== previous || progress >= ball.begin + .085)) {
      ball.route = makeRoute(ball, glyph, Math.min(progress, .98), down);
      ball.state = 'returning';
    }
  }
  if (dt > 0) collideMovingBodies(down, !towardText);
}

function formatAngle() {
  if (!usingMotion && !preview && Number(slider.value) === 360 && wrap(angle) === 0) return 360;
  return (Math.round(wrap(angle) * 10) % 3600) / 10;
}

function draw() {
  if (!balls.length) return;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, viewWidth, viewHeight);
  ctx.translate(viewWidth / 2, viewHeight / 2);
  ctx.rotate(-viewRotation() * Math.PI / 180);
  ctx.translate(-width / 2, -height / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  function paint(x, y, radius) {
    if (radius < .02) return;
    const cx = clamp(x, radius, width - radius), cy = clamp(y, radius, height - radius);
    ctx.moveTo(cx + radius, cy);
    ctx.arc(cx, cy, radius, 0, tau);
  }
  for (const group of groups) {
    const swallow = group.swallow;
    if (swallow && physicsTime < swallow.until) {
      const eaten = smooth(1 - (swallow.until - physicsTime) / mergeTime);
      paint(group.x, group.y, Math.sqrt(swallow.mass + swallow.incoming * eaten));
      paint(group.x + swallow.x * (1 - eaten), group.y + swallow.y * (1 - eaten),
        Math.sqrt(swallow.incoming * (1 - eaten)));
    } else {
      const attached = group.emissions.reduce((mass, ball) => mass +
        (ball.emission ? ball.r ** 2 * (1 - emissionProgress(ball.emission)) : 0), 0);
      paint(group.x, group.y, Math.sqrt(group.mass + attached));
    }
  }
  for (const ball of balls) if (ball.state !== 'absorbed') {
    const fraction = ball.emission ? emissionProgress(ball.emission) : 1;
    paint(ball.x, ball.y, ball.r * Math.sqrt(fraction));
  }
  ctx.fill();
  const shown = formatAngle();
  if (document.activeElement !== slider || usingMotion || preview) slider.value = shown;
  readout.value = shown + '°';
}

function stopPreview() {
  preview = null;
  play.textContent = '播放預覽';
}

function useManual() {
  stopPreview();
  if (usingMotion) {
    usingMotion = false;
    resize();
  }
  motion.textContent = '啟用陀螺儀';
  motion.setAttribute('aria-pressed', 'false');
  status.textContent = '拖曳畫面、使用滑桿，或播放預覽';
}

slider.addEventListener('input', () => {
  useManual();
  setAngle(Number(slider.value));
});

stage.addEventListener('pointerdown', event => {
  if (drag || event.button !== 0) return;
  useManual();
  drag = {id: event.pointerId, x: event.clientX, origin: angle};
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener('pointermove', event => {
  if (drag?.id === event.pointerId) setAngle(drag.origin + (event.clientX - drag.x) * 360 / Math.max(120, viewWidth));
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  stage.addEventListener(type, event => { if (drag?.id === event.pointerId) drag = null; });
}
stage.addEventListener('keydown', event => {
  if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  useManual();
  setAngle(angle + (event.key === 'ArrowRight' ? 5 : -5));
});

play.addEventListener('click', () => {
  if (preview) {
    preview.paused = !preview.paused;
    play.textContent = preview.paused ? '繼續預覽' : '暫停預覽';
    return;
  }
  useManual();
  const base = Math.round(angle / 360) * 360;
  setAngle(base);
  preview = {base, pause: .9, midpoint: false, paused: false};
  play.textContent = '暫停預覽';
});
function advancePreview(dt) {
  if (!preview || preview.paused) return;
  if (preview.pause > 0) { preview.pause -= dt; return; }
  const midpoint = preview.base + 180, end = preview.base + 360;
  const goal = preview.midpoint ? end : midpoint;
  const distance = goal - angle;
  const offset = angle - (preview.midpoint ? midpoint : preview.base);
  const speed = Math.min(lerp(2.8, 11, smooth(range(offset, 1, 18))),
    lerp(3.2, 11, smooth(range(distance, 13, 32))));
  setAngle(Math.min(goal, angle + speed * dt));
  if (angle !== goal) return;
  if (preview.midpoint) stopPreview();
  else { preview.midpoint = true; preview.pause = 1.4; }
}

// Device orientation follows the deployed “比較” scene's projection, zero and time filter.
function orient(event) {
  if (!Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
  const beta = event.beta * Math.PI / 180, gamma = event.gamma * Math.PI / 180;
  const gx = Math.cos(beta) * Math.sin(gamma), gy = Math.sin(beta);
  if (Math.hypot(gx, gy) < .16) {
    if (usingMotion) status.textContent = '請將平板立起，讓旋轉方向穩定';
    return;
  }
  // Keep the comparison controller timing, with a clockwise-positive dial.
  const raw = Math.atan2(gx, gy) * 180 / Math.PI;
  lastEvent = performance.now();
  if (lastRaw === null) {
    lastRaw = raw;
    zero = unwrapped - angle;
  }
  unwrapped += ((raw - lastRaw + 540) % 360) - 180;
  lastRaw = raw;
  if (!usingMotion) return;
  const target = unwrapped - zero;
  const dt = Math.min(100, lastEvent - lastSensorTime || 16);
  lastSensorTime = lastEvent;
  const error = target - (filtered ?? target);
  if (Math.abs(error) > .12) filtered = (filtered ?? target) + error * (1 - Math.exp(-dt / 35));
  setAngle(filtered ?? target);
  status.textContent = '陀螺儀已啟用';
}

motion.addEventListener('click', async () => {
  if (usingMotion) { useManual(); return; }
  try {
    if (!window.isSecureContext) throw Error('感應需要 HTTPS，請在部署網址開啟。滑桿與拖曳仍可使用。');
    const Sensor = window.DeviceOrientationEvent;
    if (!Sensor) throw Error('這個裝置未提供方向感測');
    if (typeof Sensor.requestPermission === 'function' && await Sensor.requestPermission() !== 'granted') {
      throw Error('未取得方向感測權限，可使用滑桿或拖曳');
    }
    stopPreview();
    usingMotion = true;
    lastRaw = null;
    filtered = angle;
    zero = unwrapped - angle;
    resize();
    motion.textContent = '停用陀螺儀';
    motion.setAttribute('aria-pressed', 'true');
    status.textContent = '請正立拿穩平板，讓螢幕面向觀眾';
    setTimeout(() => {
      if (usingMotion && performance.now() - lastEvent > 2500) status.textContent = '尚未收到方向資料，請確認動作權限';
    }, 3000);
  } catch (error) {
    status.textContent = error.message;
  }
});
document.querySelector('#zero').addEventListener('click', () => {
  stopPreview();
  zero = unwrapped;
  filtered = 0;
  calibrationScreen = screenRotation();
  setAngle(0);
  appliedAngle = 0;
  settledAt = 0;
  groups = [];
  for (const ball of balls) endAt(ball, 0);
  resize();
  status.textContent = '已將目前方向校正為 0°';
});
window.addEventListener('deviceorientation', orient);
const syncScreenFrame = () => { if (usingMotion) resize(); };
if (window.screen?.orientation) window.screen.orientation.addEventListener('change', syncScreenFrame);
else window.addEventListener('orientationchange', syncScreenFrame);

resize();
new ResizeObserver(resize).observe(stage);
let previous = performance.now(), accumulated = 0;
function frame(now) {
  const elapsed = clamp((now - previous) / 1000, 0, .08);
  previous = now;
  advancePreview(elapsed);
  accumulated += elapsed;
  // Consume the newest angle even on a display frame without a physics step.
  if (accumulated < step && angle !== appliedAngle) update(0);
  while (accumulated >= step) {
    update(step);
    accumulated -= step;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
